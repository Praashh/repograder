name: 'Repograder Agent Readiness Gate'
description: 'Score codebase readiness for AI coding agents and benchmark cost across 7 dimensions'
author: 'praashh'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  path:
    description: 'Path to target repository or workspace directory'
    required: false
    default: '.'
  fail-under:
    description: 'Fail CI if ceiling readiness score (1-5) is below threshold'
    required: false
    default: '4'
  format:
    description: 'Report output format (text, json, markdown, sarif, codeclimate, html)'
    required: false
    default: 'text'
  benchmark:
    description: 'Run AI friendliness cost & compute benchmark'
    required: false
    default: 'false'
  model:
    description: 'Model preset for benchmark (sonnet, flash, gpt4o, haiku, deepseek, local)'
    required: false
    default: 'sonnet'
  fail-over-cost:
    description: 'Fail CI if benchmark cost per 1k issues exceeds budget'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run Repograder Gate
      shell: bash
      run: |
        CLI_PATH="${{ github.action_path }}/dist/bin/cli.js"
        if [ ! -f "$CLI_PATH" ]; then
          CLI_PATH="npx repograder"
        else
          CLI_PATH="node $CLI_PATH"
        fi

        if [ "${{ inputs.benchmark }}" = "true" ]; then
          ARGS="benchmark ${{ inputs.path }} --model ${{ inputs.model }}"
          if [ -n "${{ inputs.fail-over-cost }}" ]; then
            ARGS="$ARGS --fail-over-cost ${{ inputs.fail-over-cost }}"
          fi
          $CLI_PATH $ARGS
        else
          $CLI_PATH "${{ inputs.path }}" --format "${{ inputs.format }}" --fail-under "${{ inputs.fail-under }}"
        fi
